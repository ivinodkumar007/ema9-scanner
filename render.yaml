services:
  - type: web
    name: ema9-scanner
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --timeout 900 --keep-alive 5 --graceful-timeout 30 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: UPSTOX_ANALYTICS_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ema9-postgres
          property: connectionString

databases:
  - name: ema9-postgres
    plan: free
    region: oregon
